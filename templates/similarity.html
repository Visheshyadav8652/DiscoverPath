<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Similar Places</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/destinations.css') }}">
</head>
<body>

<header>
    <a href="/" class="logo"><span>D</span>iscover<span>P</span>ath</a>

    <nav class="navbar">
        <a href="{{ url_for('dashboard') }}">Home</a>
        <a href="{{ url_for('my_itineraries') }}">My Itineraries</a>
        <a href="{{ url_for('popular_recommendations') }}">Recommendations</a>
        <a href="{{ url_for('route') }}">Optimize</a>
        <a href="/contactus">Contact</a>
    </nav>

    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <a href="/logout" class="btn" id="logout">Logout</a>
    </div>

    <form action="" method="post" class="search-bar-container">
        <input type="search" id="search-bar" placeholder="search here...">
        <label for="search-bar" class="fas fa-search"></label>
    </form>
</header>

<div class="container mt-5 d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
    <h1 class="display-4 text-center">Find Similar Places</h1>
    <form method="POST" action="/similarity" class="text-center mb-4">
        <input type="text" name="input_text" placeholder="Enter Zone, State, City, Name, Type, Significance, or Season" required class="form-control mx-auto"
        style="width: 400px; padding: 10px; font-size: 16px;">
        <input type="submit" value="Find Similar Places" class="btn btn-primary mt-3">
    </form>

    <div class="result text-center mt-4">
        {% if places %}
            <h2 class="mt-4">Recommended Places:</h2>
            <div class="row">
                {% for place in places %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm" style="border: 1px solid #ddd; border-radius: 8px;">
                        <img src="{{ place['img'] }}" class="card-img-top" alt="{{ place['name'] }}" style="height: 200px; object-fit: cover;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" style="font-weight: bold">{{ place['name'] }}</h5>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% elif result %}
            <p>{{ result }}</p>
        {% endif %}

    <div class="text-center mt-4">
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Home</a>
    </div>
    </div>
</div>


<!-- jQuery -->
<script src="{{ url_for('static', filename='js/jquery-3.5.1.slim.min.js') }}"></script>

<!-- Popper.js -->
<script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>

<!-- Bootstrap JS -->
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

</body>
</html>
